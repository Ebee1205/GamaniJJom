[project]
name = "gamani-jjom"
version = "0.1.0"
description = "Windows window position and size utility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "orjson>=3.13,<4", "pydantic>=2.14,<3"]

# Run this desktop application from src/main.py; distribution packaging is deferred.
[tool.ruff]
target-version = "py311"
line-length = 100
